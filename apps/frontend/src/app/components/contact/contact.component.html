<section class="contact-section" id="contacto">
  <div class="contact-container">
    
    <!-- Left Column: Info -->
    <div class="contact-info-panel">
      <h2 class="contact-title">¿Tienes un proyecto en mente?</h2>
      <p class="contact-description">
        Cuéntame qué quieres construir. Leo cada mensaje y respondo desde mi correo personal.
      </p>

      <ul class="contact-features">
        <li>
          <span class="feature-icon">
            <i class="fa-solid fa-circle-check"></i>
          </span>
          Respuesta en menos de 24 horas
        </li>
        <li>
          <span class="feature-icon">
            <i class="fa-solid fa-circle-check"></i>
          </span>
          Consultoría inicial sin compromiso
        </li>
        <li>
          <span class="feature-icon">
            <i class="fa-solid fa-circle-check"></i>
          </span>
          Presupuesto adaptado a tu necesidad
        </li>
      </ul>
    </div>

    <!-- Right Column: Message Form Card -->
    <div class="contact-card" id="formulario-contacto">
      <h3 class="card-title">Escríbeme</h3>
      
      <!-- Notifications -->
      <div *ngIf="successMessage" class="form-alert success">
        <i class="fa-solid fa-circle-check"></i> {{ successMessage }}
      </div>
      <div *ngIf="errorMessage" class="form-alert error">
        <i class="fa-solid fa-circle-exclamation"></i> {{ errorMessage }}
      </div>

      <form (ngSubmit)="onSubmit()" #contactForm="ngForm" class="contact-form">
        <!-- Name -->
        <div class="form-group">
          <label for="name">Nombre <span class="required">*</span></label>
          <input 
            type="text" 
            id="name" 
            name="name" 
            placeholder="Tu nombre" 
            [(ngModel)]="formData.name" 
            required 
            #nameInput="ngModel"
            [class.invalid]="nameInput.invalid && nameInput.touched"
          />
        </div>

        <!-- Email -->
        <div class="form-group">
          <label for="email">Email <span class="required">*</span></label>
          <input 
            type="email" 
            id="email" 
            name="email" 
            placeholder="tu@email.com" 
            [(ngModel)]="formData.email" 
            required 
            email
            #emailInput="ngModel"
            [class.invalid]="emailInput.invalid && emailInput.touched"
          />
        </div>

        <!-- Subject -->
        <div class="form-group">
          <label for="subject">Asunto</label>
          <input 
            type="text" 
            id="subject" 
            name="subject" 
            placeholder="Ej: Consulta sobre desarrollo web" 
            [(ngModel)]="formData.subject"
          />
        </div>

        <!-- Message -->
        <div class="form-group">
          <label for="message">Mensaje <span class="required">*</span></label>
          <textarea 
            id="message" 
            name="message" 
            placeholder="Qué necesitas, para cuándo y con qué stack, si ya lo sabes" 
            [(ngModel)]="formData.message" 
            required
            #messageInput="ngModel"
            [class.invalid]="messageInput.invalid && messageInput.touched"
          ></textarea>
        </div>

        <!-- Submit Button -->
        <button type="submit" [disabled]="contactForm.invalid || isSubmitting" class="btn-submit">
          <ng-container *ngIf="!isSubmitting">
            <i class="fa-solid fa-paper-plane"></i> Enviar mensaje
          </ng-container>
          <ng-container *ngIf="isSubmitting">
            <i class="fa-solid fa-circle-notch fa-spin"></i> Enviando...
          </ng-container>
        </button>
      </form>
    </div>

  </div>
</section>
<app-footer></app-footer>
