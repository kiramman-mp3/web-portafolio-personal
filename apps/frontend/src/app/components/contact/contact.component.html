@let t = i18n.copy().contact;
<section class="contact-section" id="contacto">
  <div class="contact-container">
    
    <!-- Left Column: Info -->
    <div class="contact-info-panel">
      <h2 class="contact-title">{{ t.title }}</h2>
      <p class="contact-description">{{ t.description }}</p>

      <ul class="contact-features">
        @for (f of t.features; track f) {
          <li>
            <span class="feature-icon">
              <i class="fa-solid fa-circle-check" aria-hidden="true"></i>
            </span>
            {{ f }}
          </li>
        }
      </ul>
    </div>

    <!-- Right Column: Message Form Card -->
    <div class="contact-card" id="formulario-contacto">
      <h3 class="card-title">{{ t.card }}</h3>
      
      <!-- Notifications -->
      <div *ngIf="successMessage" class="form-alert success">
        <i class="fa-solid fa-circle-check"></i> {{ successMessage }}
      </div>
      <div *ngIf="errorMessage" class="form-alert error">
        <i class="fa-solid fa-circle-exclamation"></i> {{ errorMessage }}
      </div>

      <form (ngSubmit)="onSubmit()" #contactForm="ngForm" class="contact-form">
        <!-- Name -->
        <div class="form-group">
          <label for="name">{{ t.name }} <span class="required">*</span></label>
          <input 
            type="text" 
            id="name" 
            name="name" 
            [placeholder]="t.namePh" 
            [(ngModel)]="formData.name" 
            required 
            #nameInput="ngModel"
            [class.invalid]="nameInput.invalid && nameInput.touched"
          />
        </div>

        <!-- Email -->
        <div class="form-group">
          <label for="email">{{ t.email }} <span class="required">*</span></label>
          <input 
            type="email" 
            id="email" 
            name="email" 
            [placeholder]="t.emailPh" 
            [(ngModel)]="formData.email" 
            required 
            email
            #emailInput="ngModel"
            [class.invalid]="emailInput.invalid && emailInput.touched"
          />
        </div>

        <!-- Subject -->
        <div class="form-group">
          <label for="subject">{{ t.subject }}</label>
          <input 
            type="text" 
            id="subject" 
            name="subject" 
            [placeholder]="t.subjectPh" 
            [(ngModel)]="formData.subject"
          />
        </div>

        <!-- Message -->
        <div class="form-group">
          <label for="message">{{ t.message }} <span class="required">*</span></label>
          <textarea 
            id="message" 
            name="message" 
            [placeholder]="t.messagePh" 
            [(ngModel)]="formData.message" 
            required
            #messageInput="ngModel"
            [class.invalid]="messageInput.invalid && messageInput.touched"
          ></textarea>
        </div>

        <!-- Submit Button -->
        <button type="submit" [disabled]="contactForm.invalid || isSubmitting" class="btn-submit">
          <ng-container *ngIf="!isSubmitting">
            <i class="fa-solid fa-paper-plane" aria-hidden="true"></i> {{ t.send }}
          </ng-container>
          <ng-container *ngIf="isSubmitting">
            <i class="fa-solid fa-circle-notch fa-spin" aria-hidden="true"></i> {{ t.sending }}
          </ng-container>
        </button>
      </form>
    </div>

  </div>
</section>
<app-footer></app-footer>
