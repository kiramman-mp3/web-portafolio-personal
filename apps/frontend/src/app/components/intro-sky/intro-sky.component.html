@let t = i18n.copy().intro;
@if (!done()) {
  <div class="intro" [class.is-leaving]="leaving()" role="presentation">
    <canvas #sky class="intro-sky" aria-hidden="true"></canvas>
    <div class="intro-copy">
      <p #title class="intro-title">
        <span class="line">{{ t.line1 }}</span>
        <span class="line">{{ t.line2 }}</span>
      </p>
      <p class="intro-subtitle" [class.is-visible]="showSubtitle()">{{ t.subtitle }}</p>
    </div>
    <button type="button" class="intro-skip" (click)="skip()">{{ t.skip }}</button>
  </div>
}
