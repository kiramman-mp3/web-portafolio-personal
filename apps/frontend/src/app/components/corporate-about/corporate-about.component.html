@let t = i18n.copy().about;
<section id="quienes-somos" class="corporate-about-section" data-nav="theme-dark">
  <div class="corporate-about-container">
    <div class="section-header home-section-header">
      <h2 class="section-title">{{ t.title }}</h2>
    </div>
    <div class="about-layout glass">
      <div class="about-bio">
        @for (p of t.paragraphs; track p) {
          <p>{{ p }}</p>
        }
      </div>
      <dl class="about-facts">
        @for (fact of t.facts; track fact[0]) {
          <div class="fact">
            <dt>{{ fact[0] }}</dt>
            <dd>{{ fact[1] }}</dd>
          </div>
        }
      </dl>
    </div>
  </div>
</section>
