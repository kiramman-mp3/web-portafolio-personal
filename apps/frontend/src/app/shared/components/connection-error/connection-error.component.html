<div class="connection-error-state" role="alert">
  <i class="fas fa-wifi"></i>
  <h3>Sin conexión</h3>
  <p>Comprueba tu conexión a internet e inténtalo de nuevo.</p>
  <button type="button" class="btn-retry" (click)="retry.emit()">
    <i class="fas fa-rotate-right"></i> Reintentar
  </button>
</div>
