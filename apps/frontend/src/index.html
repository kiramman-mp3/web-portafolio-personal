  <script>
    // Intro del cielo: solo en la portada y solo la primera visita (o con movimiento reducido, nunca).
    // intro-active bloquea el scroll; se retira sola a los 9 s por si Angular no arranca.
    (function () {
      var root = document.documentElement;
      var reduce = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;
      var seen = false;
      try { seen = localStorage.getItem('intro-seen') === '1'; } catch (e) { seen = true; }
      var home = location.pathname === '/' || location.pathname === '/en' || location.pathname === '/en/';
      if (reduce || seen || !home) {
        root.classList.add('skip-intro');
      } else {
        root.classList.add('intro-active');
        setTimeout(function () { root.classList.remove('intro-active'); }, 9000);
      }
    })();
  </script>
  <style>
    html {
      background-color: #0a0405;
    }

    html.intro-active {
      overflow: hidden;
    }
  </style>
